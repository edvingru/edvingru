name: Generate snake

on:
  schedule:
    # rebuild once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7dd3fc&color_dots=#05080f,#0b3d63,#125e97,#1e88e5,#7dd3fc
            dist/snake-light.svg?palette=github-light&color_snake=#0284c7&color_dots=#eef6ff,#bfe3fb,#7dd3fc,#38bdf8,#0284c7

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
