name: Generate snake

on:
  schedule:
    # rebuild once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e5e5e5&color_dots=#0a0a0a,#2b2b2b,#4a4a4a,#6e6e6e,#c9c9c9
            dist/snake-light.svg?palette=github-light&color_snake=#3f3f3f&color_dots=#f0f2f5,#d4d4d4,#a3a3a3,#737373,#3f3f3f

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
